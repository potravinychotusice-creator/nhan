<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akce Unikom</title>
<style>
/* 19.11 anh: làm lại kiểu e-shop như tab Gợi ý đặt hàng – lưới thẻ có ảnh, dàn hết chiều ngang, giỏ bên phải (máy tính) */
:root{--n:#f5f6f2;--c:#fff;--x:#1f6b3a;--xn:#e6f1ea;--d:#c8102e;--m:#5f6a63;--v:#dde2da;--cam:#8a5a00;--camn:#fbefd6;--ph:#fff;--fg:#1d2320}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--n);color:var(--fg);padding-bottom:90px}
.tren{position:sticky;top:0;z-index:5;background:var(--n);padding:8px 16px 6px;border-bottom:1px solid var(--v)}
.hang{display:flex;gap:6px}
input[type=search]{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--v);border-radius:10px;background:var(--c);color:var(--fg)}
select{font:inherit;font-size:15px;padding:8px;border:1px solid var(--v);border-radius:10px;background:var(--c);color:var(--fg);max-width:44%}
.chip{display:flex;gap:6px;overflow-x:auto;padding-top:6px;scrollbar-width:none}
.chip button{flex:none;font:inherit;font-size:13px;border:1px solid var(--v);background:var(--c);color:var(--fg);border-radius:99px;padding:4px 10px;white-space:nowrap;cursor:pointer}
.chip button[aria-pressed=true]{background:var(--x);color:#fff;border-color:var(--x)}
.tt{font-size:12px;color:var(--m);padding:6px 16px}
.kh{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:0 16px;align-items:start}
.nhom{grid-column:1/-1;font-weight:700;font-size:14px;color:var(--x);padding:8px 2px 0}
.luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px}
.sp{container-type:inline-size;background:var(--c);border:1px solid var(--v);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.sp.chon{outline:2px solid var(--x);outline-offset:-1px}
.sp .ph{height:132px;background:var(--ph);display:flex;align-items:center;justify-content:center;padding:8px;position:relative;border-bottom:1px solid var(--v)}
.sp .ph img{max-width:100%;max-height:100%;object-fit:contain}.sp .ph .no{font-size:40px;opacity:.45}
.bdg{position:absolute;top:7px;left:7px;right:7px;display:flex;flex-wrap:wrap;gap:4px}
.bdg span{font:700 11.5px/1.5 system-ui,sans-serif;padding:1px 7px;border-radius:6px}
.bdg .lt{background:var(--d);color:#fff}.bdg .sap{background:var(--camn);color:var(--cam)}.bdg .re{background:var(--x);color:#fff}
.sp .in{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.sp .tn{font-weight:600;line-height:1.3;font-size:.9rem;margin:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sp .mk{font-size:.76rem;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp .bal{display:flex;gap:4px;flex-wrap:wrap}.sp .bal span{font-size:.74rem;border:1px solid var(--v);border-radius:999px;padding:1px 8px;color:var(--m);background:var(--n)}
.sp .gia{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:2px}
.sp .gia b{font:700 1.45rem/1.1 system-ui,sans-serif;letter-spacing:-.01em}.sp .gia b small{font-size:.8rem}.sp .gia .dph{font-size:.72rem;color:var(--m)}
.sp .dv{font-size:.76rem;color:var(--m)}
.sp .ss{font-size:.8rem;line-height:1.35}.sp .ss b{color:var(--x)}.sp .ss .pt{background:var(--xn);color:var(--x);font-weight:700;border-radius:6px;padding:0 6px;white-space:nowrap}
.sp .ss.canh{color:var(--cam)}.sp .ss.canh b{color:var(--cam)}
.sp .ac{margin-top:auto;display:flex;gap:6px;align-items:center;padding-top:6px}
.sl{display:inline-flex;align-items:center;border:1px solid var(--v);border-radius:10px;overflow:hidden;flex:none;background:var(--c)}
.sl button{width:28px;height:36px;border:0;background:#eceee9;color:var(--fg);font:600 17px system-ui;cursor:pointer}
.sl input{min-width:0;width:36px;height:36px;border:0;text-align:center;font:600 15px system-ui;background:var(--c);color:var(--fg)}
.sp .cart{flex:1 1 0;min-width:0;min-height:38px;background:var(--x);color:#fff;border:0;border-radius:10px;font:700 14px system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.sp .cart.da{background:var(--xn);color:var(--x);box-shadow:inset 0 0 0 1.5px var(--x)}
.sp .krt{font-size:.74rem;color:var(--m)}
@container (max-width:185px){.sp .ac{flex-wrap:wrap}.sp .ac .sl{flex:1 1 100%}.sp .ac .sl input{flex:1 1 0}.sp .ac .cart{flex-basis:100%}.sp .gia b{font-size:1.25rem}}
.them{grid-column:1/-1;display:block;margin:12px auto;font:inherit;padding:10px 16px;border:1px solid var(--v);border-radius:10px;background:var(--c);color:var(--fg);cursor:pointer}
/* giỏ */
.gio{display:none;background:var(--c);border:1px solid var(--v);border-radius:12px;position:sticky;top:96px;max-height:calc(100vh - 110px);overflow:auto}
.gio h2{margin:0;padding:12px 14px 4px;font-size:1.1rem}
.gio .hint{margin:0;padding:0 14px 10px;color:var(--m);font-size:.8rem}
.gio .ng{border-top:1px solid var(--v)}
.gio .ng h3{margin:0;padding:9px 14px;font-size:.92rem;background:var(--xn);color:var(--x);display:flex;justify-content:space-between}
.gio .mon{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:2px 8px;padding:7px 14px;border-top:1px solid var(--v);align-items:center;font-size:.84rem}
.gio .mon img,.gio .mon .th{width:40px;height:40px;object-fit:contain;grid-row:span 2;display:flex;align-items:center;justify-content:center;opacity:1}
.gio .mon b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gio .mon small{color:var(--m);grid-column:2}
.gio .mon .t{font-weight:700;white-space:nowrap;text-align:right}
.gio .mon .x{border:0;background:none;color:var(--m);cursor:pointer;font-size:.78rem;text-decoration:underline;padding:0;justify-self:end}
.gio .tong2{padding:10px 14px;font-weight:700;display:flex;justify-content:space-between;border-top:1px solid var(--v)}
.gio .nut{display:flex;gap:6px;padding:0 14px 14px;flex-wrap:wrap}
.nut button,.duoi button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 12px;background:var(--x);color:#fff;cursor:pointer}
.nut button.phu,.duoi button.phu{background:var(--xn);color:var(--x)}
.gio .rong{padding:16px 14px;color:var(--m);text-align:center;font-size:.86rem}
.duoi{position:fixed;left:0;right:0;bottom:0;background:var(--c);border-top:1px solid var(--v);padding:8px 16px calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center;z-index:6}
.duoi .tong{flex:1;font-size:13px}
#bao{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;display:none;z-index:9}
.loi{color:var(--d);padding:20px;text-align:center}
@media (min-width:1100px){.kh{grid-template-columns:minmax(0,1fr) 330px}.gio{display:block}.duoi{display:none}body{padding-bottom:24px}}
@media (max-width:759px){.luoi{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.sp .ph{height:112px}.sp .in{padding:7px 8px 9px}.kh,.tren{padding-left:10px;padding-right:10px}}
@media (max-width:340px){.luoi{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="tren">
  <div class="hang"><input type="search" id="q" placeholder="Tìm tên, hãng, mã…" autocomplete="off">
    <select id="loc" aria-label="Lọc">
      <option value="">Tất cả</option><option value="dang">Đang chạy</option><option value="sap">⏳ Sắp tới</option>
      <option value="re">Unikom rẻ nhất</option><option value="chon">✓ Đã chọn</option></select></div>
  <div class="chip" id="lt"></div>
</div>
<div class="tt" id="tt">Đang tải…</div>
<div class="kh"><div id="ds"></div><aside class="gio" id="gio"></aside></div>
<div class="duoi"><div class="tong" id="tong">Chưa chọn món nào</div>
  <button class="phu" id="xoa">Xoá</button><button class="phu" id="chep">📋 Chép</button><button id="gui">📤 Gửi</button></div>
<div id="bao"></div>
<script>
(async () => {
  const P = window.parent, sb = P && P.SB, $ = id => document.getElementById(id);
  const bao = s => { const b = $('bao'); b.textContent = s; b.style.display = 'block'; clearTimeout(bao.t); bao.t = setTimeout(() => b.style.display = 'none', 2200) };
  const loi = s => { $('tt').innerHTML = '<div class="loi">' + s + '</div>' };
  let D = window.__AKCE;   // thử trên máy: nhúng sẵn dữ liệu
  if (!D) {
    if (!sb) { loi('Mở từ app Cửa hàng'); return }
    const cache = await caches.open('cuahang-checkgia').catch(() => null);
    // 14.11: blob do P.SB (cửa sổ cha) tạo → trên iPhone (Safari) DecompressionStream báo "Invalid type should be ArrayBuffer" vì khác cửa sổ. Chép sang Blob của trang này trước khi giải nén.
    const gunzip = async blob => await new Response(new Blob([new Uint8Array(await blob.arrayBuffer())]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    const F = 'data/akce_unikom.json';
    try {
      let man;
      try { const { data, error } = await sb.storage.from('checkgia').download('manifest.json'); if (error) throw error; man = JSON.parse(await data.text()) }
      catch (e) { const r = cache && await cache.match('/_cg/akce@last'); if (!r) throw e; D = JSON.parse(await r.text()) }
      if (!D) {
        const f = man.files[F]; if (!f) { loi('Chưa có danh sách akce trên cloud'); return }
        const k = '/_cg/' + F + '@' + f.sha; let r = cache && await cache.match(k), v;
        if (r) v = await r.text();
        else { const { data, error } = await sb.storage.from('checkgia').download(F + '.gz'); if (error) throw error; v = await gunzip(data); try { await cache.put(k, new Response(v)); await cache.put('/_cg/akce@last', new Response(v)) } catch (e) {} }
        D = JSON.parse(v);
      }
    } catch (e) { loi('Không tải được: ' + (e.message || e)); return }
  }

  // d = [leták, mã Unikom, tên, hãng, EAN, bez DPH, s DPH /ks, APC, ks/krt, nơi khác rẻ hơn [src, giá, tên] | null, giá nơi khác, ảnh]
  const LT = D.letak, hom = new Date().toISOString().slice(0, 10);
  const nd = s => { const [y, m, d] = s.split('-'); return +d + '.' + +m + '.' };
  const kc = x => (Math.round(x * 100) / 100).toLocaleString('cs-CZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const khoa = d => LT[d[0]].ten + '|' + (d[1] || d[4]);
  const bo = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const hangN = s => String(s || '').replace(/,? ?(s\.r\.o\.|a\.s\.|spol\..*)$/i, '');
  const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const IMG = d => d[11] ? '<img alt="" loading="lazy" src="' + esc(d[11]) + '" onerror="this.outerHTML=\'<span class=no>🛒</span>\'">' : '<span class="no">🛒</span>';
  D.ds.forEach(d => d.s = bo(d[2] + ' ' + d[3] + ' ' + d[1] + ' ' + d[4]));
  const BYK = {}; D.ds.forEach(d => BYK[khoa(d)] = d);

  // Số thùng đã chọn: lưu chung (tai_lieu bo=don_akce id=unikom) → điện thoại & máy tính thấy như nhau
  let SL = {}, hen;
  try { SL = JSON.parse(localStorage.getItem('don_akce') || '{}') } catch (e) {}
  if (sb) try { const { data } = await sb.from('tai_lieu').select('data').eq('bo', 'don_akce').eq('id', 'unikom').maybeSingle(); if (data && data.data && data.data.sl) SL = data.data.sl } catch (e) {}
  const luu = () => {
    try { localStorage.setItem('don_akce', JSON.stringify(SL)) } catch (e) {}
    if (sb) { clearTimeout(hen); hen = setTimeout(async () => { try { await sb.from('tai_lieu').upsert({ bo: 'don_akce', id: 'unikom', data: { sl: SL } }) } catch (e) {} }, 800) }
  };
  const NH = {};   // số thùng gõ trên thẻ chưa bỏ vào giỏ

  let ltChon = -1, gioiHan = 150;
  const chip = () => {
    $('lt').innerHTML = ['<button data-i="-1" aria-pressed="' + (ltChon < 0) + '">Mọi leták</button>'].concat(LT.map((l, i) =>
      '<button data-i="' + i + '" aria-pressed="' + (ltChon === i) + '">' + (l.tu > hom ? '⏳ ' : '') + l.ten + ' · ' + nd(l.tu) + '–' + nd(l.den) + '</button>')).join('');
  };
  $('lt').onclick = e => { const b = e.target.closest('button'); if (!b) return; ltChon = +b.dataset.i; gioiHan = 150; chip(); ve() };

  function loc() {
    const q = bo($('q').value.trim()).split(/\s+/).filter(Boolean), l = $('loc').value;
    return D.ds.filter(d => {
      if (ltChon >= 0 && d[0] !== ltChon) return false;
      const lt = LT[d[0]];
      if (l === 'dang' && lt.tu > hom) return false;
      if (l === 'sap' && lt.tu <= hom) return false;
      if (l === 're' && d[9]) return false;
      if (l === 'chon' && !SL[khoa(d)]) return false;
      return q.every(w => d.s.includes(w));
    });
  }
  function the(d) {
    const k = khoa(d), n = SL[k] || 0, v = n || NH[k] || 1, lt = LT[d[0]];
    const lai = d[7] ? Math.round((d[7] - d[6]) / d[7] * 100) : null;
    const bd = ['<span class="lt">' + esc(lt.ten) + '</span>'];
    if (lt.tu > hom) bd.push('<span class="sap">Từ ' + nd(lt.tu) + '</span>');
    else if (!d[9] && d[10]) bd.push('<span class="re">Rẻ nhất</span>');
    const so = d[9] ? '<div class="ss canh">⚠ <b>' + esc(d[9][0]) + '</b> rẻ hơn: ' + kc(d[9][1]) + ' Kč/ks</div>'
      : (d[10] ? '<div class="ss">Rẻ nhất · <span class="pt">rẻ hơn ' + Math.max(0, Math.round((d[10] - d[6]) / d[10] * 100)) + ' %</span> so với nơi khác ' + kc(d[10]) + '</div>' : '<div class="ss" style="color:var(--m)">Chưa có giá nơi khác để so</div>');
    return '<article class="sp' + (n ? ' chon' : '') + '" data-k="' + esc(k) + '">'
      + '<div class="ph">' + IMG(d) + '<div class="bdg">' + bd.join('') + '</div></div>'
      + '<div class="in"><h3 class="tn" title="' + esc(d[2]) + '">' + esc(d[2]) + '</h3>'
      + '<div class="mk" title="' + esc(hangN(d[3])) + '">' + esc(hangN(d[3])) + ' · mã ' + (d[1] || '–') + '</div>'
      + '<div class="bal"><span>' + (d[8] || '?') + ' ks/krt</span>' + (d[7] ? '<span>APC ' + kc(d[7]) + (lai != null ? ' · lãi ' + lai + ' %' : '') + '</span>' : '') + '</div>'
      + '<div class="gia"><b>' + kc(d[6]) + ' <small>Kč</small></b><span class="dph">/ks s DPH</span></div>'
      + '<div class="dv">bez DPH ' + kc(d[5]) + (d[8] ? ' · 1 krt = ' + kc(d[6] * d[8]) + ' Kč' : '') + '</div>'
      + so
      + '<div class="ac"><div class="sl"><button data-b="-1" aria-label="Bớt">−</button><input inputmode="numeric" value="' + v + '" aria-label="Số thùng (krt)" title="Số thùng (krt)"><button data-b="1" aria-label="Thêm">+</button></div>'
      + '<button class="cart' + (n ? ' da' : '') + '" data-c="1">' + (n ? '✓ Đã thêm' : '🛒 Vào giỏ') + '</button></div>'
      + '</div></article>';
  }
  function ve() {
    const r = loc(); let h = '', g = -1, grid = '';
    const dong = () => { if (grid) { h += '<div class="luoi">' + grid + '</div>'; grid = '' } };
    r.slice(0, gioiHan).forEach(d => {
      if (d[0] !== g) { dong(); g = d[0]; const l = LT[g]; h += '<div class="nhom">' + (l.tu > hom ? '⏳ ' : '') + esc(l.ten) + ' · ' + esc(l.hl) + '</div>' }
      grid += the(d);
    });
    dong();
    if (r.length > gioiHan) h += '<button class="them" id="them">Xem thêm ' + Math.min(300, r.length - gioiHan) + ' món (còn ' + (r.length - gioiHan) + ')</button>';
    $('ds').innerHTML = h || '<div class="tt">Không có món nào</div>';
    $('tt').textContent = r.length + ' món akce Unikom · giá nhập s DPH /ks · cập nhật ' + D.luc.slice(8, 10) + '.' + D.luc.slice(5, 7) + ' · không gồm hàng đặt thẳng hãng, Coca-Cola';
    tong();
  }
  function tong() {
    let m = 0, t = 0;
    for (const k in SL) { const d = BYK[k]; if (d) { m++; t += SL[k] * (d[8] || 1) * d[6] } }
    $('tong').textContent = m ? 'Đã chọn ' + m + ' món · ~' + Math.round(t).toLocaleString('cs-CZ') + ' Kč s DPH' : 'Chưa chọn món nào';
    gio();
  }
  function gio() {
    const nh = {}; let t = 0, m = 0;
    for (const k in SL) { const d = BYK[k]; if (!d) continue; (nh[d[0]] = nh[d[0]] || []).push([d, SL[k], k]); t += SL[k] * (d[8] || 1) * d[6]; m++ }
    let h = '<h2>🛒 Đơn akce Unikom</h2><p class="hint">Gom theo leták. Bấm Chép hoặc Gửi để gửi đơn – em không tự đặt hàng.</p>';
    if (!m) h += '<div class="rong">Chưa có món nào.<br>Bấm “🛒 Vào giỏ” trên thẻ để thêm.</div>';
    Object.keys(nh).sort((a, b) => a - b).forEach(i => {
      const L = nh[i], s = L.reduce((a, [d, n]) => a + n * (d[8] || 1) * d[6], 0);
      h += '<div class="ng"><h3><span>' + esc(LT[i].ten) + ' · ' + L.length + ' món</span><span>' + Math.round(s).toLocaleString('cs-CZ') + ' Kč</span></h3>'
        + L.map(([d, n, k]) => '<div class="mon">' + (d[11] ? '<img alt="" loading="lazy" src="' + esc(d[11]) + '">' : '<span class="th">🛒</span>')
          + '<b title="' + esc(d[2]) + '">' + esc(d[2]) + '</b><span class="t">' + kc(n * (d[8] || 1) * d[6]) + '</span>'
          + '<small>' + n + ' krt' + (d[8] ? ' = ' + n * d[8] + ' ks' : '') + ' × ' + kc(d[6]) + '</small><button class="x" data-x="' + esc(k) + '">Xoá</button></div>').join('') + '</div>';
    });
    if (m) h += '<div class="tong2"><span>Tổng ' + m + ' món</span><span>~' + Math.round(t).toLocaleString('cs-CZ') + ' Kč s DPH</span></div>'
      + '<div class="nut"><button class="phu" data-g="xoa">Xoá hết</button><button class="phu" data-g="chep">📋 Chép</button><button data-g="gui">📤 Gửi</button></div>';
    $('gio').innerHTML = h;
  }
  const veThe = k => { const el = [...document.querySelectorAll('.sp')].find(e => e.dataset.k === k), d = BYK[k]; if (el && d) el.outerHTML = the(d) };
  const datSL = (k, n) => { n = Math.max(0, Math.min(999, n | 0)); if (n) SL[k] = n; else delete SL[k]; luu(); veThe(k); tong() };
  $('ds').onclick = e => {
    if (e.target.id === 'them') { gioiHan += 300; ve(); return }
    const el = e.target.closest('.sp'); if (!el) return; const k = el.dataset.k;
    const b = e.target.closest('button[data-b]');
    if (b) { const cur = SL[k] || +el.querySelector('input').value || 1, nn = Math.max(SL[k] ? 0 : 1, cur + +b.dataset.b);
      if (SL[k]) datSL(k, nn); else { NH[k] = nn; el.querySelector('input').value = nn } return }
    if (e.target.closest('button[data-c]')) { if (SL[k]) datSL(k, 0); else { datSL(k, +el.querySelector('input').value || 1); bao('Đã thêm ' + BYK[k][2]) } }
  };
  $('ds').onchange = e => { if (e.target.tagName !== 'INPUT') return; const k = e.target.closest('.sp').dataset.k, n = +e.target.value | 0;
    if (SL[k]) datSL(k, n); else NH[k] = Math.max(1, n) };
  $('gio').onclick = e => { const x = e.target.closest('[data-x]'); if (x) return datSL(x.dataset.x, 0);
    const g = e.target.closest('[data-g]'); if (g) $(g.dataset.g).click() };
  let tq; $('q').oninput = () => { clearTimeout(tq); tq = setTimeout(() => { gioiHan = 150; ve() }, 200) };
  $('loc').onchange = () => { gioiHan = 150; ve() };

  function vanBan() {
    const nh = {};
    for (const k in SL) { const d = BYK[k]; if (d) (nh[d[0]] = nh[d[0]] || []).push([d, SL[k]]) }
    const ks = Object.keys(nh).sort((a, b) => a - b); if (!ks.length) return '';
    return 'Objednávka akce Unikom – Potraviny Chotusice\n\n' + ks.map(i => LT[i].ten + ' (' + LT[i].hl + ')\n' +
      nh[i].map(([d, n]) => (d[1] || d[4]) + '  ' + d[2] + '  ' + n + ' krt' + (d[8] ? ' (' + n * d[8] + ' ks)' : '')).join('\n')).join('\n\n');
  }
  $('chep').onclick = async () => { const s = vanBan(); if (!s) return bao('Chưa chọn món nào'); try { await navigator.clipboard.writeText(s); bao('Đã chép danh sách') } catch (e) { prompt('Chép đoạn này:', s) } };
  $('gui').onclick = async () => {
    const s = vanBan(); if (!s) return bao('Chưa chọn món nào');
    if (navigator.share) { try { await navigator.share({ title: 'Objednávka akce Unikom', text: s }) } catch (e) {} }
    else location.href = 'mailto:?subject=' + encodeURIComponent('Objednávka akce Unikom') + '&body=' + encodeURIComponent(s);
  };
  $('xoa').onclick = () => { if (!Object.keys(SL).length) return; if (confirm('Xoá hết số lượng đã chọn?')) { SL = {}; luu(); ve() } };
  chip(); ve();
})();
</script>
