<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>So giá leták</title>
<style>
body{margin:0;font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f7f5f0;color:#1a1a1a;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;box-sizing:border-box;text-align:center}
.hop{max-width:420px}
.vong{width:42px;height:42px;border:4px solid #e6f1ea;border-top-color:#1f6b3a;border-radius:50%;margin:0 auto 14px;animation:q 1s linear infinite}
@keyframes q{to{transform:rotate(360deg)}}
.mo{color:#6b6b6b;font-size:14px}
.loi{color:#c8102e}
button{font:inherit;min-height:50px;padding:0 22px;border:0;border-radius:12px;background:#1f6b3a;color:#fff;font-weight:700;margin-top:14px}
</style>
</head>
<body>
<div class="hop"><div class="vong" id="vong"></div><div id="tt">Đang mở So giá leták…</div><div class="mo" id="ct"></div></div>
<script>
// Trang Check giá thật (có giá nhập) nằm trong kho kín Supabase "checkgia" – chỉ tải được sau khi đăng nhập.
// File này chỉ tải về, giữ trên máy (dùng khi mất mạng) rồi mở ra; chức năng của Claude (db, F5) đổi sang Supabase.
(async () => {
  const P = window.parent, sb = P && P.SB, KHO = 'cuahang-checkgia', PRE = 'letak/', $ = id => document.getElementById(id);
  const tt = s => $('tt').textContent = s, ct = s => $('ct').textContent = s;
  const loi = (s, nut) => { $('vong').hidden = true; $('tt').innerHTML = '<span class="loi">' + s + '</span>'; ct('');
    if (nut) { const b = document.createElement('button'); b.textContent = 'Thử lại'; b.onclick = () => location.reload(); $('tt').after(b) } };
  if (!sb) { loi('Mở So giá leták từ app Cửa hàng'); return }

  const cache = await caches.open(KHO).catch(() => null);
  const docMay = async k => { try { const r = cache && await cache.match('/_lt/' + k); return r ? await r.text() : null } catch (e) { return null } };
  const luuMay = async (k, v) => { try { cache && await cache.put('/_lt/' + k, new Response(v)) } catch (e) {} };
  const gunzip = async blob => await new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).text();

  // 1. Mục lục trên cloud (nhỏ); mất mạng → bản trên máy
  let man = null, manMay = null;
  try { manMay = JSON.parse(await docMay('manifest.json') || 'null') } catch (e) {}
  try {
    // 4.11: manifest luôn lấy mới, không dùng bộ nhớ đệm trình duyệt/CDN (lỗi: bấm F5 xong vẫn mở bản cũ)
    const su = await sb.storage.from('checkgia').createSignedUrl(PRE + 'manifest.json', 60);
    if (su.error) throw su.error;
    const rm = await fetch(su.data.signedUrl + (su.data.signedUrl.includes('?') ? '&' : '?') + '_t=' + Date.now(), { cache: 'no-store' });
    if (!rm.ok) throw new Error('manifest ' + rm.status);
    man = JSON.parse(await rm.text());
  } catch (e) {
    if (!manMay) { loi(navigator.onLine ? 'Chưa có giá trên cloud (' + (e.message || e) + ')' : 'Mất mạng và máy này chưa tải So giá leták lần nào', true); return }
    man = manMay;
  }

  // 2. Tải file nào đổi (lần đầu ~5 MB), còn lại lấy trên máy
  const F = {}, ten = Object.keys(man.files);
  let i = 0;
  for (const f of ten) {
    i++;
    const sha = man.files[f].sha, k = f + '@' + sha;
    let v = await docMay(k);
    if (v == null) {
      tt('Đang tải giá mới… ' + i + '/' + ten.length); ct(f.replace('data/', '') + ' · ' + Math.round(man.files[f].size / 1024) + ' KB');
      try {
        // 4.11: xuất bản theo phiên bản – mọi file đọc cùng phiên bản man.ver (bản cũ chưa có ver: đường dẫn cũ)
        const { data, error } = await sb.storage.from('checkgia').download((man.ver ? PRE + 'v/' + man.ver + '/' : PRE) + f + '.gz');
        if (error) throw error;
        v = await gunzip(data);
        await luuMay(k, v);
        if (manMay && manMay.files[f] && manMay.files[f].sha !== sha) try { await cache.delete('/_lt/' + f + '@' + manMay.files[f].sha) } catch (e) {}
      } catch (e) { loi('Không tải được ' + f + ': ' + (e.message || e), true); return }
    }
    F[f] = v;
  }
  await luuMay('manifest.json', JSON.stringify(man));
  P.__LT = { files: F, man, at: Date.now() };

  // 3. Mở trang: chèn lớp thay thế (db/fetch) trước code của trang
  let html = F['index.html'] || '';
  html = html.replace(/<script src="voice\.js"[^>]*><\/script>/, '');
  const css = '<style>#xnav{display:none!important}</style>';
  const head = '<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
    + '<script>(' + lop.toString() + ')()<\/script>' + css;
  const a = html.indexOf('<title>'), b = html.indexOf('</title>');
  const sauCung = '<script>(' + gon.toString() + ')()<\/script>';   // chạy SAU code trang: gọn giao diện, xuất ảnh từng siêu thị
  html = a >= 0 ? head + html.slice(a, b + 8) + '</head><body>' + html.slice(b + 8) + sauCung + '</body></html>' : head + '</head><body>' + html + sauCung + '</body></html>';
  document.open(); document.write(html); document.close();


  // ---- 4.11 anh: dòng trạng thái nhỏ, bộ lọc gọn vào 1 nút ở góc, xuất PNG mỗi siêu thị 1 ảnh ----
  function gon() {
    const $ = s => document.querySelector(s);
    const st = document.createElement('style');
    st.textContent = '#f5st{display:block;font-size:12px;line-height:1.35;max-height:2.7em;overflow:hidden;cursor:pointer;color:var(--muted)}#f5st.mo{max-height:none}'
      + '.f5{gap:6px}.f5 #tagd{font-size:14px}.f5 button{padding:4px 10px;font-size:12px}'
      + '.bar .loc-ds{display:none;position:absolute;right:0;left:0;top:100%;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 6px 18px rgba(0,0,0,.15);flex-direction:column;gap:6px}'
      + '.bar.loc-mo .loc-ds{display:flex}.bar{position:sticky}.loc-hang{display:flex;gap:6px;align-items:center}.loc-hang input{flex:1}'
      + '.loc-nut{flex:none;font:600 13px system-ui,sans-serif;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer;max-width:58vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}'
      + '.bar .loc-ds .seg{flex-wrap:wrap!important;overflow:visible!important}';
    document.head.appendChild(st);
    // dòng trạng thái: chạm để xem đủ
    const f5st = $('#f5st'); if (f5st) f5st.addEventListener('click', () => f5st.classList.toggle('mo'));
    // bộ lọc: các hàng chip vào 1 khung thả xuống, mở bằng nút ở góc cạnh ô tìm
    const bar = $('.bar'), q = $('#q');
    if (bar && q) {
      const lines = [...bar.querySelectorAll(':scope > .line')].filter(l => !l.contains(q));
      const ds = document.createElement('div'); ds.className = 'loc-ds'; lines.forEach(l => ds.appendChild(l));
      const hang = q.closest('.line'); hang.classList.add('loc-hang');
      const nut = document.createElement('button'); nut.type = 'button'; nut.className = 'loc-nut'; hang.appendChild(nut); bar.appendChild(ds);
      const tom = () => { const on = [...ds.querySelectorAll('button[aria-pressed="true"]')].map(b => b.childNodes[0] && b.childNodes[0].textContent.trim()).filter(t => t && !/^(Tất cả|Mọi )/.test(t)); nut.textContent = '⚙ ' + (on.length ? on.join(' · ') : 'Lọc') + ' ▾' };
      nut.onclick = e => { e.stopPropagation(); bar.classList.toggle('loc-mo') };
      ds.addEventListener('click', () => setTimeout(tom, 0));
      document.addEventListener('click', e => { if (!bar.contains(e.target)) bar.classList.remove('loc-mo') });
      new MutationObserver(tom).observe(ds, { subtree: true, attributes: true, attributeFilter: ['aria-pressed'] });
      tom();
    }
    // PNG: mỗi siêu thị 1 ảnh riêng (1 ảnh chung quá dài, xem không nét)
    const nutPng = $('#dlPng');
    if (nutPng && typeof pages === 'function' && typeof groups === 'function') {
      nutPng.textContent = 'PNG từng siêu thị';
      nutPng.onclick = async () => {
        const msg = t => { const m = $('#cartMsg'); if (m) m.textContent = t };
        const G = groups(); if (!G.length) return;
        const g0 = window.groups, p0 = window.picked;
        let n = 0;
        try {
          for (const [c, L] of G) {
            msg('Đang tạo ảnh ' + c + '…');
            window.groups = () => [[c, L]]; window.picked = () => L;
            const [cv] = await pages(0);
            const b = await new Promise(r => cv.toBlob(r, 'image/png'));
            const ten = 'di-lay-hang-' + today + '-' + c.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.png';
            await save(ten, b, ''); n++;
            await new Promise(r => setTimeout(r, 700));   // tránh trình duyệt chặn tải nhiều file một lúc
          }
          msg('Đã tải ' + n + ' ảnh (mỗi siêu thị 1 ảnh).');
        } catch (e) { msg('Chưa tạo được ảnh: ' + (e && e.message || e)) }
        finally { window.groups = g0; window.picked = p0 }
      };
    }
  }

  // ---- chạy bên trong trang So giá leták ----
  function lop() {
    const P = window.parent, sb = P.SB, F = P.__LT.files;
    const goc = window.fetch.bind(window);
    window.fetch = (u, o) => {
      const s = typeof u === 'string' ? u : (u && u.url) || '';
      const k = s.replace(location.href.replace(/[^/]*$/, ''), '').replace(/^\.?\//, '').split('?')[0];
      if (F[k] != null) return Promise.resolve(new Response(F[k], { headers: { 'Content-Type': 'application/json' } }));
      if (/^data\//.test(k)) return Promise.resolve(new Response('{}', { status: 404 }));
      return goc(u, o);
    };
    // db giống window.claude.use('db') → bảng tai_lieu. Bộ "status" đổi thành "lt_status" để không đụng F5 của Check giá.
    const BOX = bo => bo === 'status' ? 'lt_status' : bo;
    const nghe = [];
    const snapDoc = (id, r) => ({ id, exists: !!r, data: () => r ? r.data : undefined });
    async function chay(n) {
      try {
        let q = sb.from('tai_lieu').select('id,data').eq('bo', n.bo);
        if (n.id != null) { const { data, error } = await q.eq('id', n.id).maybeSingle(); if (error) throw error; n.cb(snapDoc(n.id, data)) }
        else { const { data, error } = await q; if (error) throw error; const d = data.map(r => snapDoc(r.id, r)); n.cb({ docs: d, size: d.length, empty: !d.length, forEach: f => d.forEach(f) }) }
      } catch (e) { n.err && n.err(e) }
    }
    const bao = bo => nghe.filter(n => n.bo === bo).forEach(chay);
    setInterval(() => { if (!document.hidden) nghe.forEach(chay) }, 60000);
    const doc0 = (bo, id) => ({
      id,
      async get() { const { data, error } = await sb.from('tai_lieu').select('id,data').eq('bo', bo).eq('id', id).maybeSingle(); if (error) throw error; return snapDoc(id, data) },
      async set(v, o) {
        let d = v;
        if (o && o.merge) { const c = await this.get(); d = Object.assign({}, c.exists ? c.data() : {}, v) }
        const { error } = await sb.from('tai_lieu').upsert({ bo, id, data: d }); if (error) throw error; bao(bo)
      },
      async update(v) { return this.set(v, { merge: true }) },
      async delete() { const { error } = await sb.from('tai_lieu').delete().eq('bo', bo).eq('id', id); if (error) throw error; bao(bo) },
      onSnapshot(cb, err) { const n = { bo, id, cb, err }; nghe.push(n); chay(n); return () => nghe.splice(nghe.indexOf(n), 1) }
    });
    // status/f5 của trang không dùng nữa: trạng thái F5 lấy từ hàng đợi refresh_requests (bên dưới)
    const doc = (bo, id) => bo === 'lt_status' && id === 'f5'
      ? { id, async get() { return snapDoc(id, null) }, async set() {}, async update() {}, async delete() {}, onSnapshot() { return () => {} } }
      : doc0(bo, id);
    const DB = {
      collection: bo => (bo = BOX(bo), {
        doc: id => doc(bo, String(id)),
        async get() { const { data, error } = await sb.from('tai_lieu').select('id,data').eq('bo', bo); if (error) throw error; const d = data.map(r => snapDoc(r.id, r)); return { docs: d, size: d.length, empty: !d.length, forEach: f => d.forEach(f) } },
        onSnapshot(cb, err) { const n = { bo, id: null, cb, err }; nghe.push(n); chay(n); return () => nghe.splice(nghe.indexOf(n), 1) }
      }),
      doc: p => { const i = p.indexOf('/'); return doc(BOX(p.slice(0, i)), p.slice(i + 1)) }
    };
    // tải file: trình duyệt tự tải (downloads = null). F5 không qua Claude nữa (xem dưới).
    window.claude = { use: async n => n === 'db' ? DB : null };

    // ===== F5 = "Lấy leták mới" qua hàng đợi Supabase (4.11.2026) – không cần đăng nhập =====
    // Bấm → yeu_cau_lam_moi() (cơ sở dữ liệu tự: 1 việc chờ/chạy toàn hệ thống, tối đa 1 lượt mới / 10 phút, hạn 15 phút)
    // → máy cửa hàng (tools/f5/f5_worker.py) nhận, quét Kupi, so với giá nhập đang có, đẩy phiên bản mới → báo xong → trang mở bản mới.
    (function () {
      const SONG = 90e3; // máy coi là đang chạy nếu có nhịp tim trong 90 giây
      let tt = null, cua = null, hen = null, moLai = false, loiCai = '', cuMoi = false;
      const moiLai = () => { try { const f = window.frameElement; if (f) { f.src = 'letak.html?v=' + Date.now(); return } } catch (e) {} location.reload() };
      document.addEventListener('click', ev => { if (cuMoi && ev.target && ev.target.id === 'f5st') moiLai() });
      const gio = t => t ? new Date(t).toLocaleTimeString('cs-CZ', { timeZone: 'Europe/Prague', hour: '2-digit', minute: '2-digit' }) : '';
      const ngay = t => new Date(t).toLocaleDateString('cs-CZ', { timeZone: 'Europe/Prague' });
      const hom = t => t && ngay(t) === ngay(Date.now()) ? gio(t) : (t ? ngay(t) + ' ' + gio(t) : '');
      const dmy = d => d ? d.slice(8, 10) + '.' + d.slice(5, 7) + '.' : '?';
      // phạm vi dữ liệu đang xem: giờ lấy leták + ngày giá nhập dùng để so (không quét lại khi bấm nút)
      const pham = () => { try { const m = DATA.meta, s = m.sup_dates || {}; return 'Leták lấy lúc ' + m.stamp.slice(8, 10) + '.' + m.stamp.slice(5, 7) + '. ' + m.stamp.slice(11, 16) + ' · giá nhập: Makro ' + dmy(m.mk_date) + ', JIP ' + dmy(s.jip) + ', Tamda ' + dmy(s.tamda) } catch (e) { return '' } };
      async function doc() {
        const { data, error } = await sb.rpc('trang_thai_lam_moi');
        if (error) loiCai = /function|schema cache|PGRST202/.test(error.message || '') ? 'chua_cai' : (error.message || 'mất mạng');
        else { tt = data; loiCai = '' }
        ve();
      }
      function ve() {
        const e = document.getElementById('f5st'), b = document.getElementById('f5');
        if (!e) { lich(); return }
        const song = tt && tt.may_luc && Date.now() - new Date(tt.may_luc) < SONG;
        const s = tt && tt.id ? tt.status : null;
        let m = '';
        if (loiCai === 'chua_cai') m = 'Nút chưa dùng được: chưa cài hàng đợi trên Supabase (b4-lay-gia-moi.sql).';
        else if (loiCai) m = 'Chưa xem được trạng thái (' + loiCai + ').';
        else if (s === 'cho') m = song ? '⏳ Đã gửi ' + gio(tt.tao_luc) + ' – máy cửa hàng sắp nhận…'
          : '⏸ Đã gửi ' + gio(tt.tao_luc) + ' – ĐANG CHỜ MÁY cửa hàng (máy tắt hoặc chương trình nhận lệnh chưa chạy'
            + (tt.may_luc ? '; thấy máy lần cuối ' + hom(tt.may_luc) : '') + '). Tự huỷ lúc ' + gio(tt.het_han) + ' nếu máy không nhận.';
        else if (s === 'dang_chay') m = '🔄 ' + (tt.thong_bao || 'Máy đang chạy…') + ' (nhận lúc ' + gio(tt.nhan_luc) + ', thường 2–5 phút)';
        else {
          if (s === 'xong') m = '✓ ' + (tt.thong_bao || 'Xong') + ' · ' + hom(tt.xong_luc);
          else if (s === 'loi') m = '⚠ ' + (tt.thong_bao || 'Lỗi') + ' · ' + hom(tt.cap_nhat_luc);
          else if (s === 'het_han') m = '⌛ Yêu cầu lúc ' + hom(tt.tao_luc) + ' đã huỷ: ' + (tt.thong_bao || 'máy không nhận.');
          if (tt && tt.bam_lai_luc && new Date(tt.bam_lai_luc) > Date.now()) m += (m ? ' ' : '') + '(Bấm lại được sau ' + gio(tt.bam_lai_luc) + '.)';
          if (!song && tt && tt.may_luc) m += (m ? ' ' : '') + 'Máy cửa hàng đang không chạy (thấy lần cuối ' + hom(tt.may_luc) + ').';
          if (s === 'xong' && cua === tt.id && !moLai) { moLai = true; m += ' – đang mở bản mới…'; setTimeout(moiLai, 2000) }
          // bản đang xem cũ hơn lượt đã xong → báo rõ, cho bấm mở lại
          const ml = P.__LT && P.__LT.man && P.__LT.man.luc;
          if (s === 'xong' && !moLai && ml && tt.xong_luc && new Date(ml) < new Date(tt.xong_luc) - 120e3) { m += '\n⚠ Trang đang hiện bản cũ hơn – chạm vào dòng này để mở bản mới.'; cuMoi = true }
        }
        e.textContent = (pham() ? pham() + '\n' : '') + m; e.style.whiteSpace = 'pre-line';
        if (b) b.disabled = s === 'cho' || s === 'dang_chay';
        lich();
      }
      function lich() {
        clearTimeout(hen);
        const dang = tt && (tt.status === 'cho' || tt.status === 'dang_chay');
        hen = setTimeout(() => { if (!document.hidden || dang) doc(); else lich() }, dang ? 4000 : 60000);
      }
      window.addEventListener('click', async ev => {
        const b = ev.target.closest && ev.target.closest('#f5'); if (!b) return;
        ev.preventDefault(); ev.stopImmediatePropagation();
        if (b.disabled) return;
        b.disabled = true; const e = document.getElementById('f5st'); if (e) e.textContent = 'Đang gửi yêu cầu…';
        const { data, error } = await sb.rpc('yeu_cau_lam_moi');
        if (error) {
          b.disabled = false;
          if (e) e.textContent = /function|schema cache|PGRST202/.test(error.message || '') ? 'Nút chưa dùng được: chưa cài hàng đợi trên Supabase (b4-lay-gia-moi.sql).'
            : '⚠ Chưa gửi được: ' + (error.message || error.code);
          return;
        }
        tt = data; moLai = false;
        if (data && !data.moi && data.status !== 'cho' && data.status !== 'dang_chay') { cua = null; ve(); if (e) e.textContent += '\nVừa có lượt lúc ' + gio(data.tao_luc) + ' – mỗi 10 phút chỉ 1 lượt.'; return }
        cua = data && data.id;
        doc();
      }, true);
      // nhãn nút đúng phạm vi
      const nhan = () => { const b = document.getElementById('f5'); if (b) { b.textContent = '🔄 Lấy leták mới'; b.title = 'Lấy lại akce 7 siêu thị (Kupi) và so với giá nhập máy cửa hàng đang có. Không quét lại Makro/JIP/Tamda.' } };
      const bat = () => { nhan(); doc(); setTimeout(ve, 900) };
      document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', bat) : bat();
    })();
  }
})();
</script>
</body>
</html>
