<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>So giá leták</title>
<style>
body{margin:0;font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f7f5f0;color:#1a1a1a;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;box-sizing:border-box;text-align:center}
.hop{max-width:420px}
.vong{width:42px;height:42px;border:4px solid #e6f1ea;border-top-color:#1f6b3a;border-radius:50%;margin:0 auto 14px;animation:q 1s linear infinite}
@keyframes q{to{transform:rotate(360deg)}}
.mo{color:#6b6b6b;font-size:14px}
.loi{color:#c8102e}
button{font:inherit;min-height:50px;padding:0 22px;border:0;border-radius:12px;background:#1f6b3a;color:#fff;font-weight:700;margin-top:14px}
</style>
</head>
<body>
<div class="hop"><div class="vong" id="vong"></div><div id="tt">Đang mở So giá leták…</div><div class="mo" id="ct"></div></div>
<script>
// Trang Check giá thật (có giá nhập) nằm trong kho kín Supabase "checkgia" – chỉ tải được sau khi đăng nhập.
// File này chỉ tải về, giữ trên máy (dùng khi mất mạng) rồi mở ra; chức năng của Claude (db, F5) đổi sang Supabase.
(async () => {
  const P = window.parent, sb = P && P.SB, KHO = 'cuahang-checkgia', PRE = 'letak/', $ = id => document.getElementById(id);
  const tt = s => $('tt').textContent = s, ct = s => $('ct').textContent = s;
  const loi = (s, nut) => { $('vong').hidden = true; $('tt').innerHTML = '<span class="loi">' + s + '</span>'; ct('');
    if (nut) { const b = document.createElement('button'); b.textContent = 'Thử lại'; b.onclick = () => location.reload(); $('tt').after(b) } };
  if (!sb) { loi('Mở So giá leták từ app Cửa hàng'); return }

  const cache = await caches.open(KHO).catch(() => null);
  const docMay = async k => { try { const r = cache && await cache.match('/_lt/' + k); return r ? await r.text() : null } catch (e) { return null } };
  const luuMay = async (k, v) => { try { cache && await cache.put('/_lt/' + k, new Response(v)) } catch (e) {} };
  const gunzip = async blob => await new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).text();

  // 1. Mục lục trên cloud (nhỏ); mất mạng → bản trên máy
  let man = null, manMay = null;
  try { manMay = JSON.parse(await docMay('manifest.json') || 'null') } catch (e) {}
  try {
    const { data, error } = await sb.storage.from('checkgia').download(PRE + 'manifest.json');
    if (error) throw error;
    man = JSON.parse(await data.text());
  } catch (e) {
    if (!manMay) { loi(navigator.onLine ? 'Chưa có giá trên cloud (' + (e.message || e) + ')' : 'Mất mạng và máy này chưa tải So giá leták lần nào', true); return }
    man = manMay;
  }

  // 2. Tải file nào đổi (lần đầu ~5 MB), còn lại lấy trên máy
  const F = {}, ten = Object.keys(man.files);
  let i = 0;
  for (const f of ten) {
    i++;
    const sha = man.files[f].sha, k = f + '@' + sha;
    let v = await docMay(k);
    if (v == null) {
      tt('Đang tải giá mới… ' + i + '/' + ten.length); ct(f.replace('data/', '') + ' · ' + Math.round(man.files[f].size / 1024) + ' KB');
      try {
        const { data, error } = await sb.storage.from('checkgia').download(PRE + f + '.gz');
        if (error) throw error;
        v = await gunzip(data);
        await luuMay(k, v);
        if (manMay && manMay.files[f] && manMay.files[f].sha !== sha) try { await cache.delete('/_lt/' + f + '@' + manMay.files[f].sha) } catch (e) {}
      } catch (e) { loi('Không tải được ' + f + ': ' + (e.message || e), true); return }
    }
    F[f] = v;
  }
  await luuMay('manifest.json', JSON.stringify(man));
  P.__LT = { files: F, man, at: Date.now() };

  // 3. Mở trang: chèn lớp thay thế (db/fetch) trước code của trang
  let html = F['index.html'] || '';
  html = html.replace(/<script src="voice\.js"[^>]*><\/script>/, '');
  const css = '<style>#xnav{display:none!important}</style>';
  const head = '<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
    + '<script>(' + lop.toString() + ')()<\/script>' + css;
  const a = html.indexOf('<title>'), b = html.indexOf('</title>');
  html = a >= 0 ? head + html.slice(a, b + 8) + '</head><body>' + html.slice(b + 8) + '</body></html>' : head + '</head><body>' + html + '</body></html>';
  document.open(); document.write(html); document.close();

  // ---- chạy bên trong trang So giá leták ----
  function lop() {
    const P = window.parent, sb = P.SB, F = P.__LT.files;
    const goc = window.fetch.bind(window);
    window.fetch = (u, o) => {
      const s = typeof u === 'string' ? u : (u && u.url) || '';
      const k = s.replace(location.href.replace(/[^/]*$/, ''), '').replace(/^\.?\//, '').split('?')[0];
      if (F[k] != null) return Promise.resolve(new Response(F[k], { headers: { 'Content-Type': 'application/json' } }));
      if (/^data\//.test(k)) return Promise.resolve(new Response('{}', { status: 404 }));
      return goc(u, o);
    };
    // db giống window.claude.use('db') → bảng tai_lieu. Bộ "status" đổi thành "lt_status" để không đụng F5 của Check giá.
    const BOX = bo => bo === 'status' ? 'lt_status' : bo;
    const nghe = [];
    const snapDoc = (id, r) => ({ id, exists: !!r, data: () => r ? r.data : undefined });
    async function chay(n) {
      try {
        let q = sb.from('tai_lieu').select('id,data').eq('bo', n.bo);
        if (n.id != null) { const { data, error } = await q.eq('id', n.id).maybeSingle(); if (error) throw error; n.cb(snapDoc(n.id, data)) }
        else { const { data, error } = await q; if (error) throw error; const d = data.map(r => snapDoc(r.id, r)); n.cb({ docs: d, size: d.length, empty: !d.length, forEach: f => d.forEach(f) }) }
      } catch (e) { n.err && n.err(e) }
    }
    const bao = bo => nghe.filter(n => n.bo === bo).forEach(chay);
    setInterval(() => { if (!document.hidden) nghe.forEach(chay) }, 60000);
    const doc0 = (bo, id) => ({
      id,
      async get() { const { data, error } = await sb.from('tai_lieu').select('id,data').eq('bo', bo).eq('id', id).maybeSingle(); if (error) throw error; return snapDoc(id, data) },
      async set(v, o) {
        let d = v;
        if (o && o.merge) { const c = await this.get(); d = Object.assign({}, c.exists ? c.data() : {}, v) }
        const { error } = await sb.from('tai_lieu').upsert({ bo, id, data: d }); if (error) throw error; bao(bo)
      },
      async update(v) { return this.set(v, { merge: true }) },
      async delete() { const { error } = await sb.from('tai_lieu').delete().eq('bo', bo).eq('id', id); if (error) throw error; bao(bo) },
      onSnapshot(cb, err) { const n = { bo, id, cb, err }; nghe.push(n); chay(n); return () => nghe.splice(nghe.indexOf(n), 1) }
    });
    // status/f5 của trang không dùng nữa: trạng thái F5 lấy từ hàng đợi refresh_requests (bên dưới)
    const doc = (bo, id) => bo === 'lt_status' && id === 'f5'
      ? { id, async get() { return snapDoc(id, null) }, async set() {}, async update() {}, async delete() {}, onSnapshot() { return () => {} } }
      : doc0(bo, id);
    const DB = {
      collection: bo => (bo = BOX(bo), {
        doc: id => doc(bo, String(id)),
        async get() { const { data, error } = await sb.from('tai_lieu').select('id,data').eq('bo', bo); if (error) throw error; const d = data.map(r => snapDoc(r.id, r)); return { docs: d, size: d.length, empty: !d.length, forEach: f => d.forEach(f) } },
        onSnapshot(cb, err) { const n = { bo, id: null, cb, err }; nghe.push(n); chay(n); return () => nghe.splice(nghe.indexOf(n), 1) }
      }),
      doc: p => { const i = p.indexOf('/'); return doc(BOX(p.slice(0, i)), p.slice(i + 1)) }
    };
    // tải file: trình duyệt tự tải (downloads = null). F5 không qua Claude nữa (xem dưới).
    window.claude = { use: async n => n === 'db' ? DB : null };

    // ===== F5 = "Lấy giá mới" qua hàng đợi Supabase (4.11.2026) =====
    // Bấm → hàm yeu_cau_lam_moi('letak') (tự chống bấm trùng, hạn 15 phút) → máy cửa hàng (tools/f5/f5_worker.py) nhận,
    // quét Kupi, so giá, đẩy lên kho → báo xong → trang tự mở bản mới. Máy tắt → báo rõ "đang chờ máy".
    (function () {
      const JOB = 'letak', SONG = 90e3; // máy coi là đang chạy nếu có nhịp tim trong 90 giây
      let req = null, nhip = null, cua = null, hen = null, moLai = false, loiCai = '';
      const gio = t => t ? new Date(t).toLocaleTimeString('cs-CZ', { timeZone: 'Europe/Prague', hour: '2-digit', minute: '2-digit' }) : '';
      const ngay = t => new Date(t).toLocaleDateString('cs-CZ', { timeZone: 'Europe/Prague' });
      const hom = t => t && ngay(t) === ngay(Date.now()) ? gio(t) : (t ? ngay(t) + ' ' + gio(t) : '');
      async function doc() {
        try {
          const a = await sb.from('refresh_requests').select('*').eq('job', JOB).order('tao_luc', { ascending: false }).limit(1);
          if (a.error) throw a.error;
          const b = await sb.from('may_nhip').select('may,luc').order('luc', { ascending: false }).limit(1);
          req = a.data[0] || null; nhip = (b.data && b.data[0]) || null; loiCai = '';
        } catch (e) { loiCai = /does not exist|schema cache|42P01|PGRST/.test((e && (e.message || e.code)) || '') ? 'chua_cai' : ((e && e.message) || 'mất mạng') }
        ve();
      }
      function ve() {
        const e = document.getElementById('f5st'), b = document.getElementById('f5');
        if (!e) { lich(); return }
        const song = nhip && Date.now() - new Date(nhip.luc) < SONG;
        let m = '';
        if (loiCai === 'chua_cai') m = 'Nút F5 chưa dùng được: chưa cài hàng đợi trên Supabase (b4-lay-gia-moi.sql).';
        else if (loiCai) m = 'Chưa xem được trạng thái (' + loiCai + ').';
        else if (req) {
          const s = req.status;
          if (s === 'cho') m = song ? '⏳ Đã gửi ' + gio(req.tao_luc) + ' – máy cửa hàng sắp nhận…'
            : '⏸ Đã gửi ' + gio(req.tao_luc) + ' – ĐANG CHỜ MÁY cửa hàng (máy tắt hoặc chương trình nhận lệnh chưa chạy'
              + (nhip ? '; thấy máy lần cuối ' + hom(nhip.luc) : '') + '). Tự huỷ lúc ' + gio(req.het_han) + ' nếu máy không nhận.';
          else if (s === 'dang_chay') m = '🔄 ' + (req.thong_bao || 'Máy đang chạy…') + ' (nhận lúc ' + gio(req.nhan_luc) + ', thường 2–5 phút)';
          else if (s === 'xong') m = '✓ ' + (req.thong_bao || 'Xong') + ' · ' + hom(req.xong_luc);
          else if (s === 'loi') m = '⚠ ' + (req.thong_bao || 'Lỗi') + ' · ' + hom(req.cap_nhat_luc);
          else if (s === 'het_han') m = '⌛ Yêu cầu lúc ' + hom(req.tao_luc) + ' đã huỷ: ' + (req.thong_bao || 'máy không nhận.');
          if (s === 'xong' && cua === req.id && !moLai) { moLai = true; m += ' – đang mở giá mới…'; setTimeout(() => location.reload(), 2500) }
        } else if (!song) m = nhip ? 'Máy cửa hàng không chạy (thấy lần cuối ' + hom(nhip.luc) + ').' : '';
        e.textContent = m;
        if (b) b.disabled = !!(req && (req.status === 'cho' || req.status === 'dang_chay'));
        lich();
      }
      function lich() {
        clearTimeout(hen);
        const dang = req && (req.status === 'cho' || req.status === 'dang_chay');
        hen = setTimeout(() => { if (!document.hidden || dang) doc(); else lich() }, dang ? 4000 : 60000);
      }
      window.addEventListener('click', async ev => {
        const b = ev.target.closest && ev.target.closest('#f5'); if (!b) return;
        ev.preventDefault(); ev.stopImmediatePropagation();
        if (b.disabled) return;
        b.disabled = true; const e = document.getElementById('f5st'); if (e) e.textContent = 'Đang gửi yêu cầu…';
        const { data, error } = await sb.rpc('yeu_cau_lam_moi', { p_job: JOB });
        if (error) {
          b.disabled = false;
          if (e) e.textContent = /function|schema cache|PGRST202/.test(error.message || '') ? 'Nút F5 chưa dùng được: chưa cài hàng đợi trên Supabase (b4-lay-gia-moi.sql).'
            : '⚠ Chưa gửi được: ' + (error.message || error.code);
          return;
        }
        req = data; cua = data && data.id; moLai = false; doc();
      }, true);
      const bat = () => { doc(); setTimeout(ve, 900) };
      document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', bat) : bat();
    })();
  }
})();
</script>
</body>
</html>
