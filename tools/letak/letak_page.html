<style>
/* Layout: shelf-ticket list — price-tag header, sticky filter bar (chuỗi · nhóm · chế độ), one ticket per akce with wholesaler comparison at the right */
:root{
  --bg:#f5f6f2; --panel:#ffffff; --fg:#1d2320; --muted:#5f6a63; --line:#dde2da;
  --accent:#c8102e; --good:#1f7a4d; --good-bg:#e2f2e8; --warn:#8a5a00; --warn-bg:#fbefd6;
  --info:#24548f; --info-bg:#e3ecf8; --chk:#7a3e9d; --chk-bg:#f1e6f7; --neutral-bg:#eceee9;
  --display:"Be Vietnam Pro",system-ui,sans-serif; --body:"Be Vietnam Pro",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131715; --panel:#1b201d; --fg:#e6eae7; --muted:#9aa49e; --line:#2c332f;
  --accent:#ff5a6e; --good:#6fd39c; --good-bg:#16301f; --warn:#f0c064; --warn-bg:#33280f;
  --info:#8db8f0; --info-bg:#17263a; --chk:#d6a4f0; --chk-bg:#2c1d36; --neutral-bg:#232926; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131715; --panel:#1b201d; --fg:#e6eae7; --muted:#9aa49e; --line:#2c332f;
  --accent:#ff5a6e; --good:#6fd39c; --good-bg:#16301f; --warn:#f0c064; --warn-bg:#33280f;
  --info:#8db8f0; --info-bg:#17263a; --chk:#d6a4f0; --chk-bg:#2c1d36; --neutral-bg:#232926; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:14px}
header h1{font-family:var(--display);font-weight:700;font-size:1.55rem;margin:0;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.tag{display:inline-block;background:var(--accent);color:#fff;font-weight:600;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:3px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-family:var(--mono);font-size:1.35rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.8rem}
.bar{display:flex;flex-direction:column;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:2;border-bottom:1px solid var(--line)}
.line{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:5px 10px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg button small{opacity:.7;margin-left:3px;font-family:var(--mono)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);flex:1 1 180px;min-width:0}
.list{display:flex;flex-direction:column;gap:6px}
.row{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.5fr);gap:6px 14px;align-items:start}
.row.buy{border-left-color:var(--good)} .row.even{border-left-color:var(--warn)} .row.chk{border-left-color:var(--chk)}
.name{display:flex;gap:10px;align-items:flex-start;min-width:0}.nt{min-width:0}.name b{font-weight:600}
.th{flex:0 0 48px;width:48px;height:48px;border-radius:6px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}.th img{max-width:100%;max-height:100%;object-fit:contain}
.name .sub{display:block;color:var(--muted);font-size:.8rem}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--neutral-bg);color:var(--muted)}
.pill.buy{background:var(--good-bg);color:var(--good)} .pill.even{background:var(--warn-bg);color:var(--warn)}
.pill.chain{background:var(--fg);color:var(--bg)} .pill.fut{background:var(--info-bg);color:var(--info)}
.pill.chk{background:var(--chk-bg);color:var(--chk)} .pill.lim{background:var(--warn-bg);color:var(--warn)} .pill.end{background:var(--accent);color:#fff}
.cell{font-variant-numeric:tabular-nums;min-width:0}
.cell .lab{display:block;font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cell .p{font-family:var(--mono);font-size:1.02rem;font-weight:600}
.cell.k .p{color:var(--accent)}
.cell .m{display:block;font-size:.76rem;color:var(--muted);overflow-wrap:anywhere}
.cell a{color:var(--info)}
.more{align-self:center;font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 16px;border-radius:999px;cursor:pointer}
.grp{font-size:.9rem;font-weight:600;margin:10px 0 2px;color:var(--muted);text-wrap:balance}.grp small{font-weight:400;margin-left:4px}.grp.warn{color:var(--accent)}
.row{position:relative;padding-top:28px}
.pick{position:absolute;z-index:1;top:6px;right:10px;padding:4px;display:flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--muted);cursor:pointer}
.pick input{width:20px;height:20px;accent-color:var(--good);cursor:pointer}
.row.picked{outline:2px solid var(--good);outline-offset:-1px}
.cart{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--fg);color:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cart button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:7px 14px;background:var(--bg);color:var(--fg);cursor:pointer}
.cart button.ghost{background:transparent;color:var(--bg);border:1px solid var(--bg)}
.cart .msg{font-size:.8rem;opacity:.85}
.cart{transition:transform .25s ease;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:6px;padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}.cart::-webkit-scrollbar{display:none}
.cart.hid{transform:translateY(100%)}.cart #cartN{white-space:nowrap;font-size:.85rem;font-weight:600}.cart button{padding:4px 11px;font-size:.85rem;white-space:nowrap;flex:none}
.cart .msg{position:absolute;left:12px;right:12px;bottom:100%;background:var(--fg);color:var(--bg);padding:4px 10px;border-radius:8px 8px 0 0}.cart .msg:empty{display:none}

.wrap{padding-bottom:110px}
.shop{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.shophead{display:flex;justify-content:space-between;align-items:center;gap:8px}.shophead h2{margin:0;font-size:1.15rem}
.ghost{font:inherit;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer}
.hint{margin:0;color:var(--muted);font-size:.82rem}
.sg h3{margin:10px 0 4px;font-size:1rem}
.si{display:grid;grid-template-columns:28px 48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.si input{width:22px;height:22px;accent-color:var(--good)}
.si.done .sn{text-decoration:line-through;color:var(--muted)}
.si .sp{font-family:var(--mono);font-weight:600;color:var(--accent);text-align:right}
.si small{display:block;color:var(--muted);font-size:.76rem}
.si .w{color:var(--accent);font-weight:600}
.foot{color:var(--muted);font-size:.8rem;max-width:80ch}
.empty{color:var(--muted);padding:20px;text-align:center}
@media (max-width:760px){.row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.row .name{grid-column:1/-1}}
[hidden]{display:none!important}
.bar{transition:transform .25s ease}.bar.hid{transform:translateY(calc(-100% - 12px))}/* 26.10 anh: vuốt xuống thì menu ẩn hẳn, vuốt lên thì hiện lại */
@media(max-width:700px){.bar{gap:4px;padding-block:6px}.bar .seg button{padding:4px 10px;font-size:13px}#q{padding:6px 10px}}
.f5{margin:6px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}.bar .seg{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}.bar .seg button{white-space:nowrap;flex:none}.f5 button{font:600 13px system-ui,sans-serif;padding:5px 12px;border-radius:999px;border:1px solid #0f6b4f;background:#0f6b4f;color:#fff;cursor:pointer}.f5 button:disabled{opacity:.6}
</style><style id="xnavcss">.xnav{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;font:500 13px system-ui,sans-serif;border-bottom:1px solid rgba(127,127,127,.25)}.xnav a{padding:4px 10px;border-radius:999px;text-decoration:none;color:inherit;border:1px solid rgba(127,127,127,.35)}.xnav a.on{background:#0f6b4f;color:#fff;border-color:#0f6b4f}</style>

<nav class="xnav" id="xnav"><a href="https://claude.ai/artifact/DzWTp6yUKmPQR6UmFJQvV2" target="_blank" rel="noopener" class=on>So giá leták</a><a href="https://claude.ai/artifact/9AcLvvsnur5RUJvgr8TL6s" target="_blank" rel="noopener">Săn giá Makro</a><a href="https://claude.ai/artifact/BED1NqBcXFGoDbWn21kHnk" target="_blank" rel="noopener">Check giá ở nhiều nơi</a></nav><header>

</header>
<section class="stats" id="stats" hidden></section>
<div class="bar">
  <div class="line"><div class="seg" id="chain"></div></div>
  <div class="line"><div class="seg" id="day"></div></div>
  <div class="line"><div class="seg" id="grp"></div><div class="seg" id="mode"></div></div>

  <button type="button" class="ghost" id="clearPick" aria-label="Bỏ chọn hết">✕ Bỏ hết</button>

</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const DATA=__DATA__;
// 30.10: dùng NGÀY THẬT (không phải ngày quét) – trước đây akce bắt đầu sau ngày quét (Kaufland Pá–Ne 30.10 banány) vẫn bị coi là 'Sắp có'
const today=(()=>{const n=new Date();const s=new Date(n.getTime()-n.getTimezoneOffset()*6e4).toISOString().slice(0,10);return s>DATA.meta.today?s:DATA.meta.today})();
const daysTo=s=>s?Math.round((new Date(s)-new Date(today))/864e5):99;
const $=s=>document.querySelector(s);
const dd=s=>{if(!s)return'';const[y,m,d]=s.split('-');return +d+'.'+ +m+'.'};
const M=DATA.meta;
const F=['chain','g','cat','n','amt','p','pct','unit','the','d0','d1','fut','lim','cond','note','lk','st','diff','best','sup','cheap','oth','prod','did','inv'];
const rows=DATA.D.map(a=>{const o={};F.forEach((k,i)=>o[k]=a[i]);if(o.d0)o.fut=o.d0>today?1:0;o.good=o.st==='buy'||o.cheap;return o});
const CH=['Kaufland','Lidl','Penny','Albert','Billa','Tesco','Globus'];
// hạn chính của leták mỗi chuỗi = ngày kết thúc gặp nhiều nhất (trong các món đang chạy); món kết thúc sớm hơn = akce ngắn ngày
const MAIN={};CH.forEach(c=>{const n={};rows.filter(r=>r.chain===c&&!r.fut&&r.d1&&daysTo(r.d1)<=10).forEach(r=>n[r.d1]=(n[r.d1]||0)+1);MAIN[c]=Object.entries(n).sort((a,b)=>b[1]-a[1])[0]?.[0]||''});
rows.forEach(r=>{r.short=!r.fut&&r.d1&&MAIN[r.chain]&&r.d1<MAIN[r.chain]});
const WD=['CN','T2','T3','T4','T5','T6','T7'];
const wd=s=>s?WD[new Date(s+'T12:00').getDay()]+' '+dd(s):'';
const win=r=>(r.d0?wd(r.d0)+' – ':'nay – ')+(wd(r.d1)||'?');
const fmt=n=>n==null?'—':Number(n).toLocaleString('cs-CZ',{minimumFractionDigits:2,maximumFractionDigits:2});
/* 26.10 anh: đầu trang chỉ cần “giá cập nhật lúc mấy giờ” + F5 */$('#tagd').textContent='Giá cập nhật '+(M.stamp?dd(M.stamp.slice(0,10))+' '+M.stamp.slice(11,16):dd(today));
$('#hdr').textContent=`Akce của 7 siêu thị (cả leták tuần sau nếu đã đăng) so với giá nhập s DPH: Makro Distribuce, JIP (${dd(M.sup_dates.jip)}), Tamda (${dd(M.sup_dates.tamda)}), Bidfood/Nowaco (23.10), Unikom (ceník CeposOS 24.10). Mọi giá quy về cùng khối lượng, dung tích, số cái hoặc số dávka. Lidl và hàng nhãn riêng so theo cùng loại và cùng khối lượng (ghi “khác hãng”).`;
/* 26.10 18h anh: mặc định thấy HẾT hàng akce của siêu thị, lọc chỉ là tuỳ chọn thêm */
const S={chain:'all',g:'all',mode:'all',day:'all',sort:'han',q:''};
/* 4.11 anh: tuỳ chọn sắp xếp riêng trong menu */
const SORTS=[['han','Theo hạn'],['re','Giá rẻ → đắt'],['dat','Giá đắt → rẻ'],['dep','Giá đẹp nhất'],['letak','Theo leták']];
const lkPage=r=>{if(!r.lk)return 999;const m=String(r.lk).match(/page=(\d+)/);return m?+m[1]:1};   // link không ghi trang = trang 1 (bìa)
try{Object.assign(S,JSON.parse(localStorage.getItem('lt2')||'{}'));S.q=''}catch(e){}
/* 26.10 anh: chỉ 3 lựa chọn – giá đẹp, rẻ hơn giá nhập, rẻ nhất giữa siêu thị (bỏ ngắn ngày, sắp có, giới hạn ks, nghi ghép sai, tất cả) */
const MODES=[['all','Tất cả hàng',r=>true],['bia','Trang bìa leták',r=>lkPage(r)<=1],['bia3','Trang 1–3 leták',r=>lkPage(r)<=3],['good','Giá đẹp',r=>r.good],['buy','Rẻ hơn giá nhập',r=>r.st==='buy'],['cheap','Rẻ nhất giữa siêu thị',r=>r.cheap],['inv','Hàng anh đang nhập',r=>!!r.inv],['invc','Siêu thị rẻ hơn hàng đang nhập → lấy',r=>r.inv&&r.p<=r.inv[2]*0.97],['own','Đề xuất akce tuần sau (nhập rẻ hơn siêu thị)',r=>r.st==='sup'&&r.best&&!r.best.x]];if(!MODES.some(m=>m[0]===S.mode))S.mode='all';
/* 26.10 18h anh: thêm cột “Hôm nay” = akce đang chạy hôm nay (bỏ món sắp có / chưa tới ngày) */
const onToday=r=>!r.fut&&(!r.d0||r.d0<=today)&&(!r.d1||r.d1>=today);
/* 29.10 anh: tách leták MỚI và leták CŨ (còn hạn nhưng ra trước, hay hết hàng). Mỗi chuỗi: leták mới = ngày bắt đầu muộn nhất trong các akce đang chạy hôm nay */
const NEWD={};CH.forEach(c=>{const A=rows.filter(r=>r.chain===c&&onToday(r)),n={};A.forEach(r=>{if(r.d0)n[r.d0]=(n[r.d0]||0)+1});
  const ok=Object.keys(n).filter(d=>n[d]>=Math.max(10,A.length*0.15)).sort();if(ok.length)NEWD[c]=ok[ok.length-1]});/* ngày ra leták mới = ngày bắt đầu muộn nhất có ≥15 % món của chuỗi (bỏ vài món lẻ) */
const isNew=r=>onToday(r)&&r.d0&&NEWD[r.chain]&&r.d0>=NEWD[r.chain],isOld=r=>onToday(r)&&!isNew(r);
const DAYS=[['all','Mọi ngày',r=>true],['new','Leták mới',isNew],['old','Leták cũ',isOld],['now','Hôm nay',onToday],['fut','Sắp có',r=>!onToday(r)]];
const DAYF=r=>(DAYS.find(d=>d[0]===S.day)||DAYS[0])[2](r);
function base(ex){return rows.filter(r=>(ex==='chain'||S.chain==='all'||r.chain===S.chain)&&(ex==='g'||S.g==='all'||r.g===S.g)&&(ex==='day'||DAYF(r)))}
function seg(el,items,key){el.innerHTML=items.map(([v,l,c])=>`<button type="button" data-v="${v}" aria-pressed="${S[key]===v}">${l}${c!=null?`<small>${c}</small>`:''}</button>`).join('');
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;S[key]=b.dataset.v;shown=150;render()}}
const na=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');let FZL=null;
function fzVoc(list,nameOf){const V=new Map();for(const it of list){for(const w of na(nameOf(it)).split(/[^a-z]+/))if(w.length>=4)V.set(w,(V.get(w)||0)+1)}return V}
function fzEd(a,b,lim){const m=a.length,n=b.length;if(Math.abs(m-n)>lim)return lim+1;let p2=null,p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];let lo=i;for(let j=1;j<=n;j++){let v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));if(p2&&i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])v=Math.min(v,p2[j-2]+1);c[j]=v;if(v<lo)lo=v}if(lo>lim)return lim+1;p2=p;p=c}return p[n]}
function fzFix(v,V){const ch=[];const q=v.split(/(\s+)/).map(tok=>{const w=na(tok);if(w.length<4||!/^[a-z]+$/.test(w)||V.has(w))return tok;const lim=w.length<=6?1:2;let best=null,bd=9,bc=0;
  for(const [c,n] of V){let d;if(c.length>=5&&w.startsWith(c)&&w.length-c.length<=4)d=1;else{if(Math.abs(c.length-w.length)>lim)continue;d=fzEd(w,c,lim)}if(d<=lim&&(d<bd||(d===bd&&n>bc))){best=c;bd=d;bc=n}}
  if(best){ch.push(tok+' → '+best);return best}return tok}).join('');return {q,ch}}
let EANM=null;let shown=150;
function render(){
  try{localStorage.setItem('lt2',JSON.stringify({chain:S.chain,g:S.g,mode:S.mode,day:S.day,sort:S.sort}))}catch(e){}
  if(!SORTS.some(x=>x[0]===S.sort))S.sort='han';seg($('#sort'),SORTS.map(([v,l])=>[v,l,null]),'sort');
  const bc=base('chain'),mf=MODES.find(m=>m[0]===S.mode)[2];
  seg($('#chain'),[['all','Tất cả',bc.filter(mf).length],...CH.map(c=>[c,c,bc.filter(r=>r.chain===c&&mf(r)).length])],'chain');

  try{await dl.save({filename:name,data});$('#cartMsg').textContent=msg}catch(e){$('#cartMsg').textContent=e&&e.code==='declined'?'Đã huỷ tải.':'Chưa tải được ('+(e&&e.code||'lỗi')+').'}}
const fname=ext=>`di-lay-hang-${today}.${ext}`;
$('#dlPng').onclick=async()=>{if(!picked().length)return;if(picked().length>110){$('#cartMsg').textContent='Danh sách dài quá cho 1 ảnh, anh dùng Tải PDF.';return}$('#cartMsg').textContent='Đang tạo ảnh…';const [cv]=await pages(0);
  cv.toBlob(b=>save(fname('png'),b,'Đã tải ảnh PNG.'),'image/png')};
$('#dlPdf').onclick=async()=>{if(!picked().length)return;if(!window.jspdf){$('#cartMsg').textContent='Không tải được thư viện PDF, anh dùng Tải PNG.';return}
  $('#cartMsg').textContent='Đang tạo PDF…';const P=await pages(1754);const pdf=new window.jspdf.jsPDF({unit:'px',format:[1240,1754],hotfixes:['px_scaling']});
  P.forEach((cv,i)=>{if(i)pdf.addPage([1240,1754]);pdf.addImage(cv.toDataURL('image/jpeg',0.88),'JPEG',0,0,1240,1754)});
  save(fname('pdf'),pdf.output('blob'),'Đã tải PDF.')};

// ===== 26.10 anh: nút F5 để lấy leták + so giá ngay lúc cần (gọi tác vụ trên máy cửa hàng; trạng thái ở db status/f5) =====
(function(){const TRIG='trig_01E1SHM6LG8ztKuJuwQTcmon';let S=null,DBX=null,MCPX;
 const el=()=>document.getElementById('f5st');
 const show=()=>{const e=el();if(!e)return;if(!S){e.textContent='';return}
  const t=S.at?new Date(S.at).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  e.textContent=S.state==='requested'?'⏳ đã gửi lệnh '+t:S.state==='running'?'⏳ đang lấy (~5 phút)':S.state==='done'?'✓ có giá mới '+t+' – tải lại trang':S.state==='error'?'⚠ F5 lỗi '+t:''};
 (async()=>{try{DBX=await cuse('db');if(DBX)DBX.doc('status/f5').onSnapshot(d=>{S=d&&d.exists?d.data():null;show()},()=>{})}catch(e){}})();
 document.addEventListener('click',async ev=>{const b=ev.target.closest&&ev.target.closest('#f5');if(!b)return;ev.preventDefault();
  if(S&&/requested|running/.test(S.state)&&Date.now()-new Date(S.at)<40*60e3){el().textContent+=' – đang chạy rồi, anh đợi xong nhé.';return}
  if(MCPX===undefined){try{MCPX=await cuse('mcp')}catch(e){MCPX=null}}
  if(!MCPX){el().textContent='Bản này không bấm F5 được – mở trang trong app Claude, hoặc nhắn em “so giá leták”.';return}
  b.disabled=true;el().textContent='Đang gửi lệnh…';
  try{await MCPX.callTool('Claude Code Remote','fire_trigger',{trigger_id:TRIG,text:'Anh bấm F5 lúc '+new Date().toLocaleString('cs-CZ')});S={state:'requested',at:new Date().toISOString()};if(DBX)DBX.doc('status/f5').set(S).catch(()=>{});show()}
  catch(err){const c=err&&err.code;el().textContent=(c==='approval_required'||c==='not_in_manifest')?'Cần cho phép trang dùng “Claude Code Remote” – bấm F5 lần nữa và chọn Cho phép.':'Chưa gửi được ('+(c||'lỗi')+') – anh nhắn em “so giá leták”.'}
  finally{b.disabled=false}},true);
 setTimeout(show,500)})();

  acc=(Math.sign(d)===Math.sign(acc))?acc+d:d;if(acc>40)H(true);else if(acc<-30)H(false)},{passive:true});
 document.addEventListener('focusin',e=>{if(e.target&&e.target.id==='q')H(false)})})();
