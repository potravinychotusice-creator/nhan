<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Săn hàng Makro</title>
<style>
/* 15.11.2026 anh chọn: tab riêng "Săn hàng Makro" theo mẫu điện thoại (lưới thẻ có ảnh, giá mới, giá cũ gạch, % giảm) */
:root{--n:#f4f5f7;--c:#fff;--x:#0f6b3a;--xn:#dcf3e5;--d:#c8102e;--m:#5b6170;--v:#e3e5e9;--cam:#b45309}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--n);color:#16181d}
.tren{position:sticky;top:0;z-index:5;background:var(--c);padding:10px 12px 8px;border-bottom:1px solid var(--v);display:flex;flex-direction:column;gap:8px}
.dau{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dau b{font-size:17px}.dau span{font-size:12px;color:var(--m);text-align:right}.dau span.cu{color:var(--d);font-weight:600}
input[type=search]{width:100%;font:inherit;font-size:16px;padding:8px 12px;border:0;border-radius:10px;background:#f1f2f4}
.chip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.chip::-webkit-scrollbar{display:none}
.chip button{flex:none;font:inherit;font-size:13px;border:0;background:#f1f2f4;color:#3b404b;border-radius:999px;padding:6px 12px;white-space:nowrap;cursor:pointer}
.chip button[aria-pressed=true]{background:#16181d;color:#fff;font-weight:600}.chip button small{margin-left:4px;opacity:.7}
.tt{font-size:12px;color:var(--m);padding:8px 12px 0}
.luoi{padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}
@media (min-width:640px){.luoi{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
@media (min-width:1100px){.luoi{max-width:1500px;margin:0 auto}.tren{padding-inline:max(12px,calc(50% - 740px))}}
.the{background:var(--c);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:5px;box-shadow:0 1px 2px rgba(0,0,0,.06);text-decoration:none;color:inherit;position:relative}
.the.mo{opacity:.55}
.anh{height:96px;border-radius:8px;background:#eceef1;display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}
.anh img{width:100%;height:100%;object-fit:contain;background:#fff}
.ten{font-size:12.5px;font-weight:600;line-height:1.25;height:31px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gia{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}.gia b{font-size:16px;color:var(--x)}.gia s{font-size:11.5px;color:var(--m)}
.duoi{display:flex;justify-content:space-between;align-items:center;gap:4px}
.pt{background:var(--xn);color:#0b4d2a;border-radius:6px;padding:2px 6px;font-size:11.5px;font-weight:700;white-space:nowrap}
.ghi{font-size:11px;color:var(--m);text-align:right;line-height:1.25}
.ss{font-size:11px;line-height:1.3;color:var(--m)}.ss .re{color:var(--x);font-weight:600}.ss .dat{color:var(--d);font-weight:600}
.tag{position:absolute;top:12px;left:12px;display:flex;gap:4px;flex-wrap:wrap}
.tag i{font-style:normal;font-size:10px;font-weight:700;border-radius:5px;padding:1px 5px;background:#16181d;color:#fff}.tag i.sao{background:#b45309}.tag i.am{background:#5b21b6}
.trong{grid-column:1/-1;text-align:center;color:var(--m);padding:30px 10px}
details.het{margin:4px 10px 30px;background:var(--c);border-radius:12px;padding:8px 12px}details.het summary{font-weight:600;cursor:pointer}
details.het li{font-size:13px;margin:4px 0}
.cho{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.vong{width:42px;height:42px;border:4px solid #e6f1ea;border-top-color:#1f6b3a;border-radius:50%;margin:0 auto 14px;animation:q 1s linear infinite}@keyframes q{to{transform:rotate(360deg)}}
.loi{color:var(--d)}.cho button{font:inherit;min-height:46px;padding:0 20px;border:0;border-radius:12px;background:#1f6b3a;color:#fff;font-weight:700;margin-top:12px}
</style>
</head>
<body>
<div class="cho" id="cho"><div class="vong" id="vong"></div><div id="tt0">Đang mở Săn hàng Makro…</div></div>
<div id="app" hidden>
  <div class="tren">
    <div class="dau"><b>Săn hàng Makro</b><span id="luc"></span></div>
    <input type="search" id="q" placeholder="Tìm món…" aria-label="Tìm món">
    <div class="chip" id="nhom"></div>
    <div class="chip" id="loc"></div>
  </div>
  <div class="tt" id="dem"></div>
  <div class="luoi" id="luoi"></div>
  <details class="het" id="het" hidden><summary></summary><ul></ul></details>
</div>
<script>
// Dữ liệu: kho kín Supabase checkgia/sangia/ (data/san.json do tools/san/xuat_san.py tạo sau mỗi lần quét Makro).
(async () => {
  const P = window.parent, sb = P && P.SB, KHO = 'cuahang-checkgia', PRE = 'sangia/', $ = id => document.getElementById(id);
  const loi = (s, nut) => { $('vong').hidden = true; $('tt0').innerHTML = '<span class="loi">' + s + '</span>';
    if (nut) { const b = document.createElement('button'); b.textContent = 'Thử lại'; b.onclick = () => location.reload(); $('tt0').after(b) } };
  if (!sb) { loi('Mở Săn hàng Makro từ app Cửa hàng'); return }
  const cache = await caches.open(KHO).catch(() => null);
  const docMay = async k => { try { const r = cache && await cache.match('/_sg/' + k); return r ? await r.text() : null } catch (e) { return null } };
  const luuMay = async (k, v) => { try { cache && await cache.put('/_sg/' + k, new Response(v)) } catch (e) {} };
  // blob từ cửa sổ cha → chép sang Blob trang này trước khi giải nén (lỗi iPhone 14.11)
  const gunzip = async blob => await new Response(new Blob([new Uint8Array(await blob.arrayBuffer())]).stream().pipeThrough(new DecompressionStream('gzip'))).text();

  let man = null, manMay = null, S = null;
  try { manMay = JSON.parse(await docMay('manifest.json') || 'null') } catch (e) {}
  try {
    const su = await sb.storage.from('checkgia').createSignedUrl(PRE + 'manifest.json', 60);
    if (su.error) throw su.error;
    const rm = await fetch(su.data.signedUrl + (su.data.signedUrl.includes('?') ? '&' : '?') + '_t=' + Date.now(), { cache: 'no-store' });
    if (!rm.ok) throw new Error(rm.status === 400 || rm.status === 404 ? 'chưa có' : 'manifest ' + rm.status);
    man = JSON.parse(await rm.text());
  } catch (e) {
    if (!manMay) { loi(navigator.onLine ? (/chưa có|not found|Object not found/i.test(e.message || e) ? 'Chưa có dữ liệu Săn Makro trên cloud – lần quét Makro tới sẽ đẩy lên.' : 'Không tải được (' + (e.message || e) + ')') : 'Mất mạng và máy này chưa tải Săn Makro lần nào', true); return }
    man = manMay;
  }
  const f = 'data/san.json', sha = man.files && man.files[f] && man.files[f].sha;
  if (!sha) { loi('Chưa có dữ liệu Săn Makro trên cloud – lần quét Makro tới sẽ đẩy lên.', true); return }
  let v = await docMay(f + '@' + sha);
  if (v == null) {
    $('tt0').textContent = 'Đang tải giá Makro mới…';
    try {
      const { data, error } = await sb.storage.from('checkgia').download(PRE + f + '.gz');
      if (error) throw error;
      v = await gunzip(data); await luuMay(f + '@' + sha, v);
      if (manMay && manMay.files && manMay.files[f] && manMay.files[f].sha !== sha) try { await cache.delete('/_sg/' + f + '@' + manMay.files[f].sha) } catch (e) {}
    } catch (e) { loi('Không tải được dữ liệu: ' + (e.message || e), true); return }
  }
  await luuMay('manifest.json', JSON.stringify(man));
  try { S = JSON.parse(v) } catch (e) { loi('Dữ liệu hỏng – thử lại', true); return }
  $('cho').hidden = true; $('app').hidden = false;
  ve(S);
})();

function ve(S) {
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = n => n == null ? '' : Number(n).toLocaleString('cs-CZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const na = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const dEnd = s => { const m = String(s || '').match(/(\d{4})-?(\d{2})-?(\d{2})/); return m ? (+m[3]) + '.' + (+m[2]) + '.' : '' };
  const mkUrl = bb => bb && bb.length > 12 ? `https://distribuce.makro.cz/shop/pv/${bb.slice(0, -8)}/${bb.slice(-8, -4)}/${bb.slice(-4)}/x` : '';
  const ICONS = [[/pes|psí|kočk|kock|whiskas|pedigree|felix/, '🐾'], [/pivo|ležák|lezak/, '🍺'], [/víno|vino|sekt/, '🍷'], [/vodka|rum|whisk|likér|liker|gin\b/, '🥃'], [/voda|cola|nápoj|napoj|džus|dzus|limon|energ/, '🥤'],
    [/káva|kava|coffee|nescaf/, '☕'], [/čaj|caj\b|tea\b/, '🍵'], [/čokol|cokol|bonbon|oplat|sušen|susen|keks|wafer|tyčin|tycin|milka|lotus/, '🍫'],
    [/chips|brambůr|bramb|snack|tyčk|ořech|orech|arašíd/, '🥨'], [/sýr|syr|eidam|gouda|mozzar|cheddar/, '🧀'], [/mléko|mleko|jogurt|smetan|máslo|maslo|tvaroh/, '🥛'],
    [/šunk|sunk|salám|salam|klobás|klobas|párk|park|slanin|maso|kuř|kur|vepř|vepr|hověz/, '🥩'], [/chléb|chleb|rohl|pečiv|peciv|bage|houska|koláč/, '🥖'],
    [/zmrzl|mražen|mrazen|pizza/, '🧊'], [/prací|praci|gel|persil|jar\b|somat|aviv/, '🧴']];
  const ico = n => { const t = na(n); for (const [r, i] of ICONS) if (r.test(t)) return i; return '🛒' };

  const D = S.drops || [], C = S.cheap || [];
  // giờ quét + cảnh báo cũ (quá 4 giờ)
  const t = S.stamp ? new Date(S.stamp.replace(' ', 'T')) : null;
  if (t && !isNaN(t)) { const h = (Date.now() - t) / 36e5; $('luc').textContent = 'quét ' + t.toLocaleString('cs-CZ', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }) + (S.counts && S.counts.makro ? ' · ' + S.counts.makro.toLocaleString('cs-CZ') + ' món' : ''); if (h > 4) { $('luc').classList.add('cu'); $('luc').textContent += ' · số liệu cũ' } }

  const NHOM = [['', 'Tất cả'], ['Čerstvé, chlazené', 'Hàng mát'], ['Pekárna, cukrárna', 'Pekárna'], ['Mražené', 'Đông lạnh'], ['Trvanlivé', 'Hàng khô'], ['Nápoje, tabák', 'Đồ uống']];
  const LOC = [['re', 'Rẻ hơn JIP/Tamda'], ['sao', '★ Ưu tiên'], ['moi', 'Mới'], ['am', 'Giảm âm thầm'], ['bat', 'Rẻ bất thường'], ['all', 'Cả món nơi khác rẻ hơn']];
  let nhom = '', loc = 're';
  try { nhom = localStorage.getItem('san_nhom') || ''; loc = localStorage.getItem('san_loc') || 're' } catch (e) {}

  const pct = a => Math.round((1 - (a.r_eff != null ? a.r_eff : a.ratio)) * 100);
  const theDrop = a => {
    const u = mkUrl(a.bb), so = a.c_cheaper ? `<span class="dat">${esc(a.c_src)} rẻ hơn ${fmt(a.c_eq)}</span>` : a.c_eq ? `<span class="re">Rẻ hơn ${esc(a.c_src)} ${fmt(a.c_eq)}</span>` : a.w_cheaper && a.w_eq ? `khác hãng ${esc(a.w_src)} ${fmt(a.w_eq)}` : 'không có để so';
    const g = [a.silent ? 'âm thầm' : a.end && a.end < '2099' ? 'akce đến ' + dEnd(a.end) : '', a.st != null ? 'còn ' + a.st : '', a.ks > 1 ? 'thùng ' + a.ks : ''].filter(Boolean).join(' · ');
    return `<a class="the${a.c_cheaper ? ' mo' : ''}" ${u ? `href="${u}" target="_blank" rel="noopener"` : ''}>
      <div class="anh">${a.img ? `<img loading="lazy" alt="" src="https://cdn.metro-group.com/cz/cz_pim_${esc(a.img)}.png?w=240&h=240&mode=pad&format=jpg" onerror="this.replaceWith(document.createTextNode('${ico(a.n)}'))">` : ico(a.n)}</div>
      <span class="tag">${a.new || a.ns ? '<i>MỚI</i>' : ''}${a.prio ? '<i class="sao">★</i>' : ''}${a.silent ? '<i class="am">âm thầm</i>' : ''}${a.fake ? '<i>giá gốc ảo</i>' : ''}</span>
      <div class="ten">${esc(a.n)}</div>
      <div class="gia"><b>${fmt(a.m)}</b>${a.base ? `<s>${fmt(a.base)}</s>` : ''}</div>
      <div class="duoi"><span class="pt">−${pct(a)}%</span><span class="ghi">${esc(g)}</span></div>
      <div class="ss">${so}${a.wt ? ' · ' + esc(a.wt) : ''}</div></a>`;
  };
  const theCheap = a => {
    const u = mkUrl(a.bb);
    return `<a class="the" ${u ? `href="${u}" target="_blank" rel="noopener"` : ''}>
      <div class="anh">${a.img ? `<img loading="lazy" alt="" src="https://cdn.metro-group.com/cz/cz_pim_${esc(a.img)}.png?w=240&h=240&mode=pad&format=jpg" onerror="this.replaceWith(document.createTextNode('${ico(a.n)}'))">` : ico(a.n)}</div>
      <span class="tag">${a.new ? '<i>MỚI</i>' : ''}</span>
      <div class="ten">${esc(a.n)}</div>
      <div class="gia"><b>${fmt(a.m)}</b>${a.c_eq ? `<s>${fmt(a.c_eq)}</s>` : ''}</div>
      <div class="duoi"><span class="pt">−${a.ratio ? Math.round((1 - a.ratio) * 100) : '?'}%</span><span class="ghi">${a.end && a.end < '2099' ? 'akce đến ' + dEnd(a.end) : ''}</span></div>
      <div class="ss">${a.c_src ? `so ${esc(a.c_src)}: ${esc(a.c_name || '')}` : esc(a.why || '')}</div></a>`;
  };

  function chip(el, ds, cur, dem, chon) {
    el.innerHTML = ds.map(([k, l]) => `<button type="button" data-k="${k}" aria-pressed="${k === cur}">${l}${dem ? `<small>${dem(k)}</small>` : ''}</button>`).join('');
    el.onclick = e => { const b = e.target.closest('button'); if (b) chon(b.dataset.k) };
  }
  const hopLoc = (a, k) => k === 'all' ? true : k === 're' ? !a.c_cheaper : k === 'sao' ? a.prio && !a.c_cheaper : k === 'moi' ? (a.new || a.ns) && !a.c_cheaper : k === 'am' ? a.silent && !a.c_cheaper : false;
  function veLai() {
    try { localStorage.setItem('san_nhom', nhom); localStorage.setItem('san_loc', loc) } catch (e) {}
    const q = na($('q').value.trim()), w = q ? q.split(/\s+/) : [];
    const tim = a => w.every(x => na(a.n + ' ' + a.id).includes(x));
    const theoNhom = a => !nhom || a.top === nhom;
    chip($('nhom'), NHOM, nhom, k => (loc === 'bat' ? C : D).filter(a => (!k || a.top === k) && (loc === 'bat' || hopLoc(a, loc))).length, k => { nhom = k; veLai() });
    chip($('loc'), LOC, loc, k => k === 'bat' ? C.filter(theoNhom).length : D.filter(a => theoNhom(a) && hopLoc(a, k)).length, k => { loc = k; veLai() });
    let L, fn;
    if (loc === 'bat') { L = C.filter(a => theoNhom(a) && tim(a)); fn = theCheap }
    else { L = D.filter(a => theoNhom(a) && hopLoc(a, loc) && tim(a)); fn = theDrop }
    $('dem').textContent = L.length + ' món' + (L.length > 400 ? ' · hiện 400 món đầu' : '') + (loc === 'bat' ? ' · Makro rẻ hơn JIP/Tamda ≥ 35 %' : ' · giảm ≥ 10 % so với giá thường Makro');
    $('luoi').innerHTML = L.slice(0, 400).map(fn).join('') || '<div class="trong">Không có món nào.</div>';
  }
  $('q').addEventListener('input', veLai);
  veLai();
  const G = S.gone || [];
  if (G.length) { const h = $('het'); h.hidden = false; h.querySelector('summary').textContent = 'Vừa hết hàng (' + G.length + ')';
    h.querySelector('ul').innerHTML = G.map(a => `<li>${esc(a.n)} · ${fmt(a.m)}${a.ref ? ' (thường ' + fmt(a.ref) + ')' : ''}</li>`).join('') }
}
</script>
</body>
</html>
